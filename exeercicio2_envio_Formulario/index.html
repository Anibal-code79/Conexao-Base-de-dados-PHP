<html lang="en">

<body>
    <h2>Formulario de Login</h2>
    <br><br>
    <h3>Cria uma conta na nossa pagina</h3>
    <br><br>
    <form action="pagina1.php" method="POST">

    <label for="nome">Nome:</label>
    <input type="text" id="nome" placeholder="Digite seu nome">
    <br><br>
    <label>Email:</label>
    <input type="email" id="email" placeholder="exemplo@gmail.com">
    <br><br>
    <label>Senha:</label>
    <input type="password" id="senha" placeholder="Digite a sua senha">
    <br><br>
    <label>Confirmar Senha:</label>
    <input type="password" id="senhaConfirmo" placeholder="Digite a sua senha">
    <button type="submit">Enviar</button>

</form>
